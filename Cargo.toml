[package]
name = "piscem-infer"
version = "0.8.0"
edition = "2024"
rust-version = "1.91"
readme = "README.md"
license-file = "LICENSE"
keywords = ["science", "RNA-seq", "quantification", "RAD-file"]
categories = ["command-line-utilities", "science"]
repository = "https://github.com/COMBINE-lab/piscem-infer/"
homepage = "https://piscem-infer.readthedocs.io/"
description = "A flexible tool to perform target quantification from bulk-sequencing data"
authors = ["Rob Patro", "Rob Patro <rob@cs.umd.edu>"]
include = [
  "/src/*.rs",
  "/src/utils/*.rs",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/LICENSE",
]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libradicl = { version = "0.21.2" }
salmon-infer = "2.9.1"
ahash = "0.8.9"
distrs = "0.2.1"
anyhow = "1.0.80"
clap = { version = "4.5.1", features = [
  "derive",
  "wrap_help",
  "cargo",
  "help",
  "usage",
  "error-context",
] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", default-features = true, features = [
  "env-filter",
] }
tabled = "0.22"
rayon = "1.8.1"
serde_json = "1.0.114"
serde = { version = "1.0.197", features = ["serde_derive", "derive"] }
arrow-array = "60.1"
arrow-schema = "60.1"
parquet = { version = "60.1", default-features = false, features = [
  "arrow",
  "zstd",
] }
path-tools = "0.1.0"
num-format = "0.4.4"
clap-num = "1.2.0"
indicatif = "0.18"

[[bin]]
name = "piscem-infer"
path = "src/main.rs"

[profile.release]
debug-assertions = false
lto = "thin"
panic = "abort"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.28.6"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = true

# macos-14 retires on 2026-11-02 (actions/runner-images#13518); build the
# Apple Silicon binary on macos-15 (deployment target unchanged).
[workspace.metadata.dist.github-custom-runners.aarch64-apple-darwin]
runner = "macos-15"

# dist 0.28.6 defaults x86_64-apple-darwin to macos-13, which GitHub has
# retired (jobs queue forever); build the Intel binary on macos-15-intel.
[workspace.metadata.dist.github-custom-runners.x86_64-apple-darwin]
runner = "macos-15-intel"

# Build the Linux binaries inside manylinux_2_28 containers (glibc 2.28), so
# they run on RHEL/Rocky 8, Debian 10, Ubuntu 18.10 and newer; built on the
# runners themselves they would need the runner's glibc (2.35+).
[workspace.metadata.dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-22.04"
container = { image = "quay.io/pypa/manylinux_2_28_x86_64", host = "x86_64-unknown-linux-musl" }

[workspace.metadata.dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-24.04-arm"
container = { image = "quay.io/pypa/manylinux_2_28_aarch64", host = "aarch64-unknown-linux-musl" }

